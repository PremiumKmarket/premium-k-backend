<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C1630">
<title>Premium K · 관리자</title>
<style>
/* 관리자 화면 v2.2 (2026-10-12) — ERP 직원 불러오기. v2.1: 직원 추가·직원 지정. v2.0: 휴대폰 우선. 요약 숫자 + 탭(회원/매출/고객/상품) + 회원 상세 시트 */
:root{
  --navy:#0C1630; --navy2:#16244A; --gold:#C9A456; --gold-soft:#E8D49A; --ink:#1C2333; --ink2:#5B6272; --ink3:#8A90A0;
  --bg:#F3F4F7; --card:#fff; --line:#E3E6EC; --green:#1E7A46; --green-bg:#E7F6EC; --amber:#8A4B00; --amber-bg:#FFF3E2;
  --red:#B3261E; --red-bg:#FCE8E6; --blue:#1D4ED8; --blue-bg:#E6EEFC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,select{font:inherit;font-size:16px}
.hidden{display:none !important}

/* 로그인 */
#loginBox{max-width:360px;margin:0 auto;padding:64px 20px}
#loginBox .brand{font-weight:800;font-size:26px;letter-spacing:.5px;color:var(--navy)}
#loginBox .brand b{color:var(--gold)}
#loginBox .sub{color:var(--ink2);margin:4px 0 24px}
.field{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:13px 16px;font-weight:700;min-height:48px}
.btn.primary{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #F1C4C0}
.btn.block{width:100%}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.summary{background:var(--navy);padding:0 14px 12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .brand{font-weight:800;font-size:18px;letter-spacing:.4px}
.top .brand b{color:var(--gold)}
.top .brand small{font-weight:600;font-size:12px;color:#9FB0D4;margin-left:6px}
.top .logout{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;min-height:38px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:760px;margin:0 auto}
.tile{background:var(--navy2);border-radius:12px;padding:8px 8px 9px;min-height:58px;border:1px solid rgba(255,255,255,.06);text-align:left;color:#fff}
.tile .k{font-size:11.5px;color:#B9C4DE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:19px;font-weight:800;margin-top:1px;letter-spacing:-.4px;white-space:nowrap}
.tile .v.gold{color:var(--gold-soft)}
.tile.alert{background:#3A2A0C;border-color:rgba(201,164,86,.5)}
.tile.alert .v{color:#FFD58A}

main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
h2.sec{font-size:17px;margin:18px 4px 10px;color:var(--navy);display:flex;align-items:center;justify-content:space-between}
h2.sec:first-child{margin-top:4px}
h2.sec small{font-size:13px;color:var(--ink2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card + .card{margin-top:12px}
.pad{padding:14px}

/* 검색·필터 */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;background:#fff}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;min-height:38px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{opacity:.75;margin-left:4px;font-weight:600}

/* 목록 줄 */
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;color:inherit}
.row:first-child{border-top:none}
button.row:active{background:#F6F7FA}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex-shrink:0}
.row .amt{font-weight:800;font-size:15.5px}
.row .chev{color:var(--ink3);flex-shrink:0}
.row .rank{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink2);flex-shrink:0}
.row .rank.top{background:var(--gold);color:var(--navy)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.when{font-size:12.5px;color:var(--ink3);align-self:center;margin-left:2px}
.b{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b.pending{background:var(--amber-bg);color:var(--amber)}
.b.ok{background:var(--green-bg);color:var(--green)}
.b.t1{background:#ECEFF4;color:#3E4A5E}
.b.t2{background:#FBF1DA;color:#7A5A12}
.b.t3{background:#F1F2F4;color:#6B7280}
.b.staff{background:#E9E4FB;color:#4C3A9E}
.b.admin{background:var(--blue-bg);color:var(--blue)}
.b.red{background:var(--red-bg);color:var(--red)}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);font-size:14px}
.more{display:block;width:100%;border:none;border-top:1px solid var(--line);background:#FAFBFC;color:var(--navy);font-weight:700;padding:14px;min-height:48px}

/* 매출 */
.monthsel{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.monthsel select{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;min-height:46px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.kpi{background:#fff;padding:12px}
.kpi .k{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:18px;font-weight:800;margin-top:2px}
.bars{padding:6px 14px 12px}
.bar{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.bar .m{color:var(--ink2);font-weight:600}
.bar .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--navy2),var(--navy));border-radius:6px}
.bar.cur .fill{background:linear-gradient(90deg,#B08A3E,var(--gold))}
.bar .val{font-weight:700;min-width:70px;text-align:right}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exports .btn{font-size:14px;padding:11px 10px}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tab{border:none;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:12px;font-weight:700;min-height:58px;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--navy)}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tab .dot{position:absolute;top:4px;left:calc(50% + 8px);background:#D64545;color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:1px 6px;min-width:18px}

/* 상세 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(12,22,48,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D5D9E0;margin:4px auto 10px}
.sheet h3{margin:0;font-size:20px;color:var(--navy)}
.sheet .phone{color:var(--ink2);margin-top:2px;font-size:15px}
.sheet .phone a{color:var(--navy);font-weight:700;text-decoration:none;display:inline-block;padding:9px 0;font-size:16px}
.info{margin:14px 0;border:1px solid var(--line);border-radius:14px}
.info div{display:flex;gap:12px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.info div:first-child{border-top:none}
.info dt{color:var(--ink2);width:82px;flex-shrink:0}
.info dd{margin:0;flex:1;overflow-wrap:anywhere}
.label{font-size:13px;font-weight:700;color:var(--ink2);margin:16px 2px 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 4px;font-weight:700;font-size:14px;min-height:46px;color:var(--ink2)}
.seg button.on{border:2px solid var(--navy);color:var(--navy);background:#F5F7FC}
.acts{display:grid;gap:8px;margin-top:12px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12.5px;color:var(--ink2);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (min-width:761px){
  main{padding-top:20px}
  .top-row{max-width:760px;margin:0 auto}
  .tile .v{font-size:22px}
}
@media (max-width:370px){ .tile .v{font-size:17px} .tile .k{font-size:11.5px} }
</style>
</head>
<body>

<div id="loginBox">
  <div class="brand">PREMIUM <b>K</b></div>
  <div class="sub">관리자 로그인</div>
  <input id="phone" class="field" placeholder="휴대폰 번호" inputmode="tel" autocomplete="username">
  <input id="password" class="field" type="password" maxlength="6" inputmode="numeric" placeholder="비밀번호 6자리" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()">
  <button class="btn primary block" onclick="adminLogin()">로그인</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="dashboard" class="hidden">
  <header class="top">
    <div class="top-row">
      <div class="brand">PREMIUM <b>K</b> 관리자<small>v2.2</small></div>
      <button class="logout" onclick="adminLogout()">로그아웃</button>
    </div>
  </header>
  <div class="summary">
    <div class="tiles">
      <button class="tile alert" id="tilePending" onclick="goPending()"><div class="k">승인 대기</div><div class="v" id="kPending">–</div></button>
      <button class="tile" onclick="showTab('members');setFilter('all')"><div class="k">전체 회원</div><div class="v" id="kMembers">–</div></button>
      <button class="tile" onclick="showTab('sales')"><div class="k" id="kSalesLabel">이번 달 매출</div><div class="v gold" id="kSales">–</div></button>
      <button class="tile" onclick="showTab('sales')"><div class="k">이번 달 주문</div><div class="v" id="kOrders">–</div></button>
    </div>
  </div>

  <main>
    <!-- 회원 -->
    <section id="tab-members">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="memberSearch" placeholder="상호명·전화번호·이메일 검색" oninput="memberShown=PAGE;renderMembers()">
      </div>
      <div class="chips" id="memberChips"></div>
      <div class="acts2" style="margin-bottom:10px">
        <button class="btn gold" onclick="openErpStaff()">⇣ ERP 직원 불러오기</button>
        <button class="btn ghost" onclick="openAddStaff()">＋ 직원 1명 추가</button>
      </div>
      <div class="card" id="memberList"></div>
    </section>

    <!-- 매출 -->
    <section id="tab-sales" class="hidden">
      <h2 class="sec">영업사원별 매출 <small>인센티브 5%</small></h2>
      <div class="monthsel"><select id="repSalesMonth" onchange="renderRepSales()"></select></div>
      <div class="card">
        <div class="kpis"><div class="kpi"><div class="k">총 매출</div><div class="v" id="mTotal">–</div></div><div class="kpi"><div class="k">주문</div><div class="v" id="mCount">–</div></div><div class="kpi"><div class="k">인센티브</div><div class="v" id="mInc">–</div></div></div>
        <div id="repList"></div>
      </div>
      <h2 class="sec">월별 매출 <small>최근 1년</small></h2>
      <div class="card"><div class="bars" id="revBars"></div></div>
      <h2 class="sec">고객별 총 구매액</h2>
      <div class="card" id="rankList"></div>
      <h2 class="sec">내보내기 (CSV)</h2>
      <div class="exports">
        <button class="btn ghost" onclick="exportMonthlyRevenueCsv()">월별 매출</button>
        <button class="btn ghost" onclick="exportRankingCsv()">고객 구매액</button>
      </div>
    </section>

    <!-- 고객 -->
    <section id="tab-customers" class="hidden">
      <div class="chips" id="custChips">
        <button class="chip on" data-v="active" onclick="setCustView('active')">최근 활발한 고객</button>
        <button class="chip" data-v="dormant" onclick="setCustView('dormant')">휴면 고객</button>
        <button class="chip" data-v="top" onclick="setCustView('top')">인기 상품</button>
        <button class="chip" data-v="lookup" onclick="setCustView('lookup')">고객 행동 조회</button>
      </div>
      <div id="custBody"></div>
    </section>

    <!-- 상품 -->
    <section id="tab-products" class="hidden">
      <h2 class="sec">상품</h2>
      <div class="card">
        <a class="row" href="catalog.html" style="text-decoration:none">
          <div class="main"><div class="t">상품 관리</div><div class="s">가격 · 사진 · 새 상품 추가</div></div>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <button class="row" onclick="exportPriceListCsv()">
          <div class="main"><div class="t">전체 도매가격 CSV</div><div class="s">플래티늄 · 골드 · 실버 가격표 내려받기</div></div>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
        </button>
        <button class="row" onclick="exportUsersCsv()">
          <div class="main"><div class="t">회원 목록 CSV</div><div class="s">전체 회원 정보 내려받기</div></div>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
        </button>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab on" data-tab="members" onclick="showTab('members')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.7c2 .8 3.2 2.6 3.5 5.3"/></svg>회원<span class="dot hidden" id="tabDot"></span></button>
    <button class="tab" data-tab="sales" onclick="showTab('sales')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>매출</button>
    <button class="tab" data-tab="customers" onclick="showTab('customers')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg>고객</button>
    <button class="tab" data-tab="products" onclick="showTab('products')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/></svg>상품</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://premium-k-backend.vercel.app/api';
let token = localStorage.getItem('pk_token');

// 고객이 입력한 값은 화면에 넣기 전에 반드시 이스케이프 (저장형 XSS 방지)
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const $ = id => document.getElementById(id);
const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = n => '$' + Math.round(Number(n || 0)).toLocaleString('en-US');
const fmtPhone = p => { const d = String(p || '').replace(/\D/g, ''); return d.length === 10 ? `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}` : (p || ''); };
const fmtDate = d => d ? new Date(d).toLocaleDateString('ko-KR') : '—';
const fmtDT = d => d ? new Date(d).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
function daysAgo(d) {
  if (!d) return null;
  return Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
}
function ago(d) {
  const n = daysAgo(d); if (n === null) return '방문 기록 없음';
  return n <= 0 ? '오늘 방문' : n === 1 ? '어제 방문' : `${n}일 전 방문`;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
  return data;
}

async function adminLogin() {
  const phone = $('phone').value.trim();
  const password = $('password').value.trim();
  $('loginErr').textContent = '';
  try {
    const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ phone, password }) });
    if (!data.isAdmin) { $('loginErr').textContent = '관리자 계정이 아닙니다.'; return; }
    token = data.token;
    localStorage.setItem('pk_token', token);
    enterDashboard();
  } catch (e) {
    $('loginErr').textContent = e.message;
  }
}
function enterDashboard() {
  $('loginBox').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  loadUsers().catch(() => { localStorage.removeItem('pk_token'); location.reload(); });
  loadInsights().catch(e => console.error(e));
  resetInactivityTimer();
}
function adminLogout() {
  token = null;
  localStorage.removeItem('pk_token');
  closeSheet();

const INACTIVITY_LIMIT_MS = 3 * 60 * 1000;
let inactivityTimer = null;
function resetInactivityTimer() {
  if (inactivityTimer) clearTimeout(inactivityTimer);
  if (!token) return;
  inactivityTimer = setTimeout(() => {
    if (!token) return;
    adminLogout();
    alert('3분간 조작이 없어 자동으로 로그아웃되었습니다.');
  }, INACTIVITY_LIMIT_MS);
}
['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(evt => document.addEventListener(evt, resetInactivityTimer, { passive: true }));

function showTab(name) {
  ['members', 'sales', 'customers', 'products'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== name));
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === name));

const PAGE = 20;
const TIER_LABELS = { tier1: 'Platinum 플래티늄', tier2: 'Gold 골드', tier3: 'Silver 실버' };
const TIER_SHORT = { tier1: '플래티늄', tier2: '골드', tier3: '실버' };
const TIER_CLASS = { tier1: 't1', tier2: 't2', tier3: 't3' };
let allUsers = [];
let memberFilter = null; // pending | approved | staff | admin | all
let memberShown = PAGE;

async function loadUsers() {
  const data = await api('/admin/users');
  allUsers = data.users || [];
  const pending = allUsers.filter(u => !u.approved).length;
  $('kPending').textContent = pending;
  $('kMembers').textContent = allUsers.length;
  $('tilePending').classList.toggle('alert', pending > 0);
  const dot = $('tabDot'); dot.textContent = pending; dot.classList.toggle('hidden', !pending);
  if (memberFilter === null) memberFilter = pending ? 'pending' : 'all';
  renderMembers();
}
function counts() {
  return {
    pending: allUsers.filter(u => !u.approved).length,
    approved: allUsers.filter(u => u.approved).length,
    staff: allUsers.filter(u => u.is_staff).length,
    admin: allUsers.filter(u => u.is_admin).length,
    all: allUsers.length,
  };
}
function setFilter(f) { memberFilter = f; memberShown = PAGE; renderMembers(); }
function goPending() { showTab('members'); setFilter('pending'); }
function renderMembers() {
  const c = counts();
  const defs = [['pending', '승인 대기'], ['all', '전체'], ['approved', '승인됨'], ['staff', '직원'], ['admin', '관리자']];
  $('memberChips').innerHTML = defs.filter(([k]) => k === 'all' || k === 'pending' || c[k] > 0)
    .map(([k, l]) => `<button class="chip ${memberFilter === k ? 'on' : ''}" onclick="setFilter('${k}')">${l}<span class="n">${c[k]}</span></button>`).join('');
  const q = $('memberSearch').value.trim().toLowerCase();
  const qd = q.replace(/\D/g, '');
  let list = allUsers.filter(u =>
    memberFilter === 'pending' ? !u.approved : memberFilter === 'approved' ? u.approved :
    memberFilter === 'staff' ? u.is_staff : memberFilter === 'admin' ? u.is_admin : true);
  if (q) list = list.filter(u => (u.company_name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q) ||
    (qd && String(u.phone || '').includes(qd)) || (u.rep_name || '').toLowerCase().includes(q));
  const el = $('memberList');
  if (!list.length) { el.innerHTML = `<div class="empty">${q ? '검색 결과가 없습니다.' : memberFilter === 'pending' ? '승인 대기 중인 회원이 없습니다 👍' : '회원이 없습니다.'}</div>`; return; }
  el.innerHTML = list.slice(0, memberShown).map(u => {
    const name = u.company_name || fmtPhone(u.phone);
    const sub = [u.company_name ? fmtPhone(u.phone) : (u.email || ''), u.rep_name ? '담당 ' + u.rep_name : ''].filter(Boolean).join(' · ');
    return `<button class="row" onclick="openMember('${escapeHtml(u.id)}')">
      <div class="main">
        <div class="t">${escapeHtml(name)}</div>
        <div class="s">${escapeHtml(sub) || '&nbsp;'}</div>

          ${u.approved ? '' : '<span class="b pending">승인 대기</span>'}
          <span class="b ${TIER_CLASS[u.tier || 'tier3']}">${TIER_SHORT[u.tier || 'tier3']}</span>
          ${u.is_staff ? '<span class="b staff">직원</span>' : ''}
          ${u.is_staff && u.must_change_password ? '<span class="b red">비번 변경 전</span>' : ''}
          ${u.is_admin ? '<span class="b admin">관리자</span>' : ''}
          <span class="when">${escapeHtml(u.approved ? ago(u.last_seen) : '가입 ' + fmtDate(u.created_at))}</span>
        </div>
      </div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg>
    </button>`;
  }).join('') + (list.length > memberShown ? `<button class="more" onclick="memberShown+=${PAGE};renderMembers()">더 보기 (${list.length - memberShown}명 남음)</button>` : '');

async function pickTier(t) {

  const who = u.company_name ? `${fmtPhone(u.phone)} (${u.company_name})` : fmtPhone(u.phone);
  if (!confirm(`${who} 고객을 ${TIER_LABELS[prev]} → ${TIER_LABELS[t]} 로 변경하시겠습니까?\n\n확인을 누르면 즉시 적용됩니다.`)) return;
  try {
    await api('/admin/users', { method: 'POST', body: JSON.stringify({ userId: u.id, tier: t }) });
    toast('등급을 변경했습니다'); await refreshAfter(u.id);
  } catch (e) { alert('등급 변경 실패: ' + e.message); }

async function resetPassword() {

      <button class="btn gold block" id="addStaffBtn" onclick="createStaff()">직원 계정 만들기</button>
      <button class="btn ghost block" onclick="closeSheet()">닫기</button>
    </div>`;
  $('sheetBg').classList.add('open'); $('sheet').classList.add('open');
  setTimeout(() => $('newStaffName').focus(), 250);
}
async function createStaff() {
  const name = $('newStaffName').value.trim(), phone = $('newStaffPhone').value.trim();
  if (!name || !phone) { alert('이름과 휴대폰 번호를 넣어주세요.'); return; }
  $('addStaffBtn').disabled = true;
  try {
    const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    const res = await fetch(API_BASE + '/admin/users', { method: 'POST', headers, body: JSON.stringify({ action: 'createStaff', name, phone }) });
    const data = await res.json().catch(() => ({}));
    if (res.status === 409 && data.userId && !data.isStaff) {
      if (confirm(`${fmtPhone(phone)} 은(는) 이미 가입된 번호입니다.\n\n그 계정을 직원으로 지정할까요?\n(비밀번호·주문 내역은 그대로, 플래티늄·승인·직원 크레딧 적용)`)) {
        await api('/admin/users', { method: 'POST', body: JSON.stringify({ userId: data.userId, makeStaff: true }) });
        closeSheet(); toast('기존 계정을 직원으로 지정했습니다'); await loadUsers();
      } else { $('addStaffBtn').disabled = false; }
      return;
    }
    if (!res.ok) throw new Error(data.message || data.error || '실패');
    closeSheet(); await loadUsers(); setFilter('staff');
    alert(`직원 계정을 만들었습니다.\n\n${name} · ${fmtPhone(data.user.phone)}\n처음 비밀번호: 000000\n\n직원에게 order.premium-k.com 에서 로그인한 뒤\n본인 비밀번호로 바꾸라고 전해주세요.`);
  } catch (e) { alert('직원 계정 만들기 실패: ' + e.message); $('addStaffBtn').disabled = false; }
}

async function refreshAfter(id) {
  await loadUsers();
  const u = allUsers.find(x => String(x.id) === String(id));
  if (u && sheetUser) { sheetUser = u; sheetTier = u.tier || 'tier3'; renderSheet(); }
}

// ===== 매출 · 고객 데이터 =====
let allTopSkus = [], allActiveUsers = [], allDormantCustomers = [], allCustomerRanking = [], monthlyRevenueData = [], salesByRepMonthData = [];
let topSkuViewerMap = {};
let lookupEvents = null;

async function loadInsights(phone) {
  const data = await api('/admin/insights' + (phone ? `?phone=${encodeURIComponent(phone)}` : ''));
  if (data.events) lookupEvents = data.events;
  if (data.topSkuViewers) {
    topSkuViewerMap = {};
    data.topSkuViewers.forEach(v => { const key = `${v.sku}|${v.eventType}`; (topSkuViewerMap[key] = topSkuViewerMap[key] || []).push(v); });
  }
  if (data.topSkus) allTopSkus = data.topSkus;
  if (data.activeUsers) allActiveUsers = data.activeUsers;
  if (data.dormantCustomers) allDormantCustomers = data.dormantCustomers;
  if (data.customerRanking) { allCustomerRanking = data.customerRanking; rankShown = 10; renderRanking(); }
  if (data.monthlyRevenue) { monthlyRevenueData = data.monthlyRevenue; renderRevBars(); }
  if (data.salesByRepMonth) {
    salesByRepMonthData = data.salesByRepMonth;
    const months = [...new Set(salesByRepMonthData.map(r => r.month))].sort().reverse();
    const sel = $('repSalesMonth'); const cur = sel.value;
    sel.innerHTML = months.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(monthLabel(m))}</option>`).join('');
    if (months.includes(cur)) sel.value = cur;
    renderRepSales();
  }
  updateTiles();
  renderCust();
}
function monthLabel(m) { const [y, mo] = String(m).split('-'); return mo ? `${y}년 ${Number(mo)}월` : m; }
function thisMonthKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
function updateTiles() {
  const key = thisMonthKey();
  const m = monthlyRevenueData.find(r => r.month === key);
  $('kSales').textContent = money0(m ? m.totalSales : 0);
  $('kOrders').textContent = m ? m.orderCount : 0;
  $('kSalesLabel').textContent = `${Number(key.slice(5))}월 매출`;
}
function renderRepSales() {
  const month = $('repSalesMonth').value;
  const rows = salesByRepMonthData.filter(r => r.month === month).sort((a, b) => b.totalSales - a.totalSales);
  $('mTotal').textContent = money0(rows.reduce((s, r) => s + r.totalSales, 0));
  $('mCount').textContent = rows.reduce((s, r) => s + r.orderCount, 0) + '건';
  $('mInc').textContent = money0(rows.reduce((s, r) => s + r.incentive, 0));
  $('repList').innerHTML = rows.length ? rows.map(r => `
    <div class="row"><div class="main"><div class="t">${escapeHtml(r.repName || '담당자 없음')}</div><div class="s">주문 ${r.orderCount}건 · 인센티브 ${money(r.incentive)}</div></div>
    <div class="r"><div class="amt">${money(r.totalSales)}</div></div></div>`).join('') : '<div class="empty">해당 월 주문이 없습니다.</div>';
}
function renderRevBars() {
  const el = $('revBars');
  if (!monthlyRevenueData.length) { el.innerHTML = '<div class="empty">최근 12개월 주문 데이터가 없습니다.</div>'; return; }
  const max = Math.max(...monthlyRevenueData.map(r => r.totalSales), 1); const key = thisMonthKey();
  el.innerHTML = [...monthlyRevenueData].reverse().map(r => `
    <div class="bar ${r.month === key ? 'cur' : ''}"><span class="m">${escapeHtml(String(r.month).slice(2).replace('-', '.'))}</span>
      <span class="track"><span class="fill" style="display:block;width:${Math.max(2, Math.round(r.totalSales / max * 100))}%"></span></span>
      <span class="val">${money0(r.totalSales)}</span></div>`).join('');
}
let rankShown = 10;
function renderRanking() {
  const el = $('rankList');
  if (!allCustomerRanking.length) { el.innerHTML = '<div class="empty">주문 기록이 없습니다.</div>'; return; }
  el.innerHTML = allCustomerRanking.slice(0, rankShown).map((r, i) => `
    <div class="row"><span class="rank ${i < 3 ? 'top' : ''}">${i + 1}</span>
      <div class="main"><div class="t">${escapeHtml(r.customer_name || fmtPhone(r.phone))}</div><div class="s">${escapeHtml(fmtPhone(r.phone))} · 주문 ${r.order_count}건</div></div>
      <div class="r"><div class="amt">${money(r.total_spent)}</div></div></div>`).join('')
    + (allCustomerRanking.length > rankShown ? `<button class="more" onclick="rankShown+=20;renderRanking()">더 보기 (${allCustomerRanking.length - rankShown}곳 남음)</button>` : '');
}

// ----- 고객 탭 -----
let custView = 'active', custShown = PAGE;
function setCustView(v) {
  custView = v; custShown = PAGE;
  document.querySelectorAll('#custChips .chip').forEach(c => c.classList.toggle('on', c.dataset.v === v));
  renderCust();
}
function formatDuration(seconds) {
  if (seconds === null || seconds === undefined) return '—';
  const s = Math.round(Number(seconds));
  if (s < 60) return `${s}초`;
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return r ? `${m}분 ${r}초` : `${m}분`;
  const h = Math.floor(m / 60), rm = m % 60;
  return rm ? `${h}시간 ${rm}분` : `${h}시간`;
}
const EVENT_KO = { view_product: '상품 보기', add_to_cart: '장바구니 담기', remove_from_cart: '장바구니 빼기', search: '검색', category_browse: '카테고리 보기',
  open_lightbox: '사진 크게 보기', submit_order: '주문 접수', switch_mode: '낱개/박스 전환', app_open: '접속', login: '로그인' };
function nameForPhone(p) { const u = allUsers.find(x => x.phone === p); return u && u.company_name ? u.company_name : ''; }
function moreBtn(total) { return total > custShown ? `<button class="more" onclick="custShown+=${PAGE};renderCust()">더 보기 (${total - custShown}개 남음)</button>` : ''; }
function renderCust() {
  const el = $('custBody'); if (!el) return;
  if (custView === 'active') {
    const L = allActiveUsers;
    el.innerHTML = `<h2 class="sec">최근 30일 활발한 고객 <small>${L.length}명</small></h2><div class="card">` + (L.length ? L.slice(0, custShown).map(r => `
      <div class="row"><span class="rank ${r.activity_rank <= 3 ? 'top' : ''}">${escapeHtml(r.activity_rank)}</span>
        <div class="main"><div class="t">${escapeHtml(nameForPhone(r.phone) || fmtPhone(r.phone))}</div>
        <div class="s">${escapeHtml(fmtDT(r.last_seen))} 접속 · 방문 ${escapeHtml(r.visit_count)}회</div>
        <div class="s">평균 ${formatDuration(r.avg_visit_seconds)} 머묾 · 최근 ${formatDuration(r.last_visit_seconds)}</div></div></div>`).join('') + moreBtn(L.length) : '<div class="empty">최근 30일 활동이 없습니다.</div>') + '</div>'
      + `<div class="exports" style="margin-top:12px;grid-template-columns:1fr"><button class="btn ghost" onclick="exportActiveUsersCsv()">활발한 고객 CSV</button></div>`;
  } else if (custView === 'dormant') {
    const L = allDormantCustomers;
    el.innerHTML = `<h2 class="sec">휴면 고객 <small>30일 이상 미접속 · ${L.length}곳</small></h2><div class="card">` + (L.length ? L.slice(0, custShown).map(r => {
      const n = daysAgo(r.last_seen);
      return `<div class="row"><div class="main"><div class="t">${escapeHtml(r.company_name || fmtPhone(r.phone))}</div>
        <div class="s"><a href="tel:${escapeHtml(String(r.phone || '').replace(/\D/g, ''))}" style="color:var(--navy);font-weight:700;text-decoration:none">${escapeHtml(fmtPhone(r.phone))}</a> · 가입 ${fmtDate(r.joined_at)}</div></div>
        <div class="r"><span class="b ${n === null || n >= 60 ? 'red' : 'pending'}">${n === null ? '활동 기록 없음' : n + '일 미접속'}</span></div></div>`;
    }).join('') + moreBtn(L.length) : '<div class="empty">휴면 고객이 없습니다.</div>') + '</div>'
      + `<div class="exports" style="margin-top:12px;grid-template-columns:1fr"><button class="btn ghost" onclick="exportDormantCsv()">휴면 고객 CSV</button></div>`;
  } else if (custView === 'top') {
    const L = allTopSkus;
    el.innerHTML = `<h2 class="sec">최근 30일 인기 상품 <small>조회·장바구니 기준</small></h2><div class="card">` + (L.length ? L.slice(0, custShown).map((r, i) => {
      const key = `${r.sku}|${r.event_type}`; const viewers = topSkuViewerMap[key] || [];
      return `<button class="row" onclick="openViewers(${i})"><span class="rank ${i < 3 ? 'top' : ''}">${i + 1}</span>
        <div class="main"><div class="t">${escapeHtml(r.product_name || r.sku)}</div><div class="s">${escapeHtml(EVENT_KO[r.event_type] || r.event_type)} · 고객 ${viewers.length}곳</div></div>
        <div class="r"><div class="amt">${escapeHtml(r.n)}회</div></div>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg></button>`;
    }).join('') + moreBtn(L.length) : '<div class="empty">최근 30일 기록이 없습니다.</div>') + '</div>';
  } else {
    el.innerHTML = `<h2 class="sec">고객 행동 조회</h2>
      <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="insightPhone" placeholder="고객 전화번호 (숫자만)" inputmode="tel" onkeydown="if(event.key==='Enter')lookupPhone()"></div>
      <button class="btn primary block" onclick="lookupPhone()">조회</button>
      <div class="card" style="margin-top:12px" id="lookupList">${renderLookup()}</div>`;
  }
}
function renderLookup() {
  if (!lookupEvents) return '<div class="empty">전화번호를 넣고 조회를 누르세요.</div>';
  if (!lookupEvents.length) return '<div class="empty">기록이 없습니다.</div>';
  return lookupEvents.slice(0, 100).map(e => `<div class="row"><div class="main"><div class="t">${escapeHtml(EVENT_KO[e.event_type] || e.event_type)}</div>
    <div class="s">${escapeHtml(e.sku || '')}${e.detail ? ' · ' + escapeHtml(JSON.stringify(e.detail)) : ''}</div></div><div class="r"><div class="s">${escapeHtml(fmtDT(e.created_at))}</div></div></div>`).join('');
}
async function lookupPhone() {
  const p = ($('insightPhone').value || '').replace(/\D/g, '');
  if (!p) { toast('전화번호를 넣어주세요'); return; }
  try { lookupEvents = null; await loadInsights(p); $('insightPhone').value = p; }
  catch (e) { alert(e.message); }
}
function openViewers(i) {
  const r = allTopSkus[i]; if (!r) return;
  const list = topSkuViewerMap[`${r.sku}|${r.event_type}`] || [];
  sheetUser = null;
  $('sheet').innerHTML = `<div class="grab"></div><h3>${escapeHtml(r.product_name || r.sku)}</h3>
    <div class="phone">${escapeHtml(EVENT_KO[r.event_type] || r.event_type)} · ${list.length}곳</div>
    <div class="card" style="margin-top:14px">${list.length ? list.map(v => `<div class="row"><div class="main"><div class="t">${escapeHtml(nameForPhone(v.phone) || fmtPhone(v.phone))}</div>
      <div class="s">${escapeHtml(fmtPhone(v.phone))}</div></div><div class="r"><div class="s">${escapeHtml(fmtDT(v.lastInteracted))}</div></div></div>`).join('') : '<div class="empty">기록 없음</div>'}</div>
    <button class="btn ghost block" style="margin-top:12px" onclick="closeSheet()">닫기</button>`;
  $('sheetBg').classList.add('open'); $('sheet').classList.add('open');
}

// ===== CSV 내보내기 (엑셀 한글 깨짐 방지 BOM) =====
function downloadCsv(filename, headers, rows) {
  const esc = v => { const s = (v === null || v === undefined) ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [headers.map(esc).join(',')].concat(rows.map(r => r.map(esc).join(','))).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
async function exportPriceListCsv() {
  try {
    const data = await api('/admin/insights?export=prices');
    const f = v => v != null ? v.toFixed(2) : '';
    downloadCsv('전체_도매가격.csv', ['카테고리','상품명(한글)','상품명(영문)','SKU','규격','박스당수량','Platinum 개당','Platinum 박스당','Gold 개당','Gold 박스당','Silver 개당','Silver 박스당'],
      data.products.map(p => [p.cat || '', p.nameKo || '', p.nameEn || '', p.sku || '', p.spec || '', p.ctnQty ?? '',
        p.tbd ? '가격문의' : f(p.platinumUnitPrice), p.tbd ? '가격문의' : f(p.platinumCtnPrice), p.tbd ? '가격문의' : f(p.goldUnitPrice),
        p.tbd ? '가격문의' : f(p.goldCtnPrice), p.tbd ? '가격문의' : f(p.silverUnitPrice), p.tbd ? '가격문의' : f(p.silverCtnPrice)]));
  } catch (e) { alert('가격 내보내기 실패: ' + e.message); }
}

  downloadCsv('회원목록.csv', ['전화번호','이메일','상호명','주소','담당영업사원','등급','관리자여부','직원여부','상태','가입일','최종 방문일'],

      u.is_staff ? '직원' : '', u.approved ? '승인됨' : '대기중', fmtDate(u.created_at), u.last_seen ? fmtDate(u.last_seen) : '—']));
}
function exportActiveUsersCsv() {
  downloadCsv('활발한고객_최근30일.csv', ['전화번호','활동순위','방문횟수','마지막 방문 체류시간(초)','평균 체류시간(초)','마지막 접속'],
    allActiveUsers.map(r => [r.phone, r.activity_rank, r.visit_count, r.last_visit_seconds ?? '', r.avg_visit_seconds ?? '', new Date(r.last_seen).toLocaleString('ko-KR')]));

function exportDormantCsv() {
  downloadCsv('휴면고객.csv', ['전화번호','상호명','가입일','마지막 접속'],

}
function exportRankingCsv() {
  downloadCsv('고객별_구매액랭킹.csv', ['순위','전화번호','상호명','주문건수','총 구매액'],
    allCustomerRanking.map((r, i) => [i + 1, r.phone, r.customer_name || '', r.order_count, Number(r.total_spent).toFixed(2)]));
}
function exportMonthlyRevenueCsv() {
  downloadCsv('월별매출추이.csv', ['월','주문건수','총 매출'], monthlyRevenueData.map(r => [r.month, r.orderCount, Number(r.totalSales).toFixed(2)]));
}
