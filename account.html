<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C1630">
<title>Premium K · 내 계정 My Account</title>
<style>
/* 내 계정 v2.0 (2026-10-12) — 주문 사이트와 같은 남색·금색, 휴대폰 우선 */
:root{
  --navy:#0C1630; --navy2:#16244A; --gold:#C9A456; --orange:#C9A456; --bg:#F3F4F7; --card:#FFFFFF;
  --line:#E3E6EC; --text:#1C2333; --text-2:#5B6272; --green:#1E7A46; --red:#B3261E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:40px;font-size:15px;}
.brand{background:var(--navy);padding:calc(12px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:10;}
.brand .title{color:#fff;font-size:17px;font-weight:800;letter-spacing:.3px;}
.brand .title b{color:var(--gold);}
.brand .sub{color:#B9C4DE;font-size:13px;margin-top:2px;}
.brand a{color:#fff;font-size:14px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;background:rgba(255,255,255,.12);border-radius:10px;padding:9px 12px;margin-top:10px;min-height:40px;}
.wrap{padding:14px;max-width:640px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
h2{font-size:16px;color:var(--navy);margin:0 0 12px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:6px;}
input, textarea{border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;width:100%;font-family:inherit;background:#fff;}
input:disabled{background:#F6F7F9;color:var(--text);}
textarea{min-height:64px;resize:vertical;}
button{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;min-height:48px;width:100%;font-family:inherit;}
button.secondary{background:#fff;color:var(--navy);border:1px solid var(--line);}
button.danger{background:#fff;color:var(--red);border:1px solid #F1C4C0;}
button.small{padding:9px 12px;font-size:13.5px;min-height:40px;width:auto;}
.msg{font-size:14px;margin-top:8px;}
.msg.err{color:var(--red);}
.msg.ok{color:var(--green);}
.addr-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;}
.addr-item > div:first-child{flex:1 1 200px;min-width:0;}
.addr-item > div:last-child{flex-direction:row !important;gap:8px !important;}
.addr-item .pill{font-size:12px;font-weight:700;color:#7A5A12;background:#FBF1DA;border-radius:999px;padding:2px 8px;margin-left:6px;}
.order-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px;}
.order-item > div:first-child{display:flex;flex-wrap:wrap;gap:4px;justify-content:space-between;align-items:baseline;}
.order-item > div:first-child > span:first-child{font-size:17px;}
.order-item .meta{color:var(--text-2);font-size:13px;margin-top:3px;}
.order-item pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;max-height:260px;overflow-y:auto;display:none;font-family:inherit;}
a.linklike{color:var(--navy);font-size:14px;font-weight:700;text-decoration:underline;cursor:pointer;display:inline-block;padding:12px 0 8px;}
#loginGate{max-width:360px;margin:32px auto;text-align:center;}
#loginGate .field{text-align:left;}
#newAddrDefault{width:20px !important;height:20px;flex-shrink:0;}
</style>
</head>
<body>

<div class="brand">
  <div class="title">PREMIUM <b>K</b> · 내 계정 My Account</div>
  <div class="sub" id="whoami"></div>
  <div style="margin-top:8px;">
    <a href="#" onclick="goBackToShop();return false;">‹ Back to Shopping 주문하러 가기</a>
  </div>
</div>

<div id="loginGate" class="card" style="display:none;">
  <h2 style="text-align:center;">Login required 로그인이 필요합니다</h2>
  <div class="field"><label>Phone Number 휴대폰 번호</label><input id="lgPhone" placeholder="213-000-0000"></div>
  <div class="field"><label>비밀번호 Password (6 digits)</label><input id="lgPassword" type="password" maxlength="6" inputmode="numeric" placeholder="••••••"></div>
  <button style="width:100%;" onclick="doLogin()">Login 로그인</button>
  <div id="loginMsg" class="msg"></div>
  <div style="margin-top:10px;"><a class="linklike" onclick="toggleForgot()">Forgot password? 비밀번호를 잊으셨나요?</a></div>
  <div id="forgotBox" style="display:none;margin-top:10px;">
    <input id="forgotPhone" placeholder="Registered phone number 가입한 휴대폰번호">
    <button class="secondary" style="width:100%;margin-top:8px;" onclick="requestReset()">Send Reset Email 재설정 이메일 받기</button>
    <div id="forgotMsg" class="msg"></div>
  </div>
</div>

<div class="wrap" id="mainContent" style="display:none;">

  <div class="card">
    <h2>Profile 내 정보</h2>
    <div class="field"><label>Phone 휴대폰 번호</label><input id="profPhone" disabled></div>
    <div class="field"><label>Email 이메일</label><input id="profEmail" disabled></div>
    <div class="field"><label>Company 상호명</label><input id="profCompany" disabled></div>
    <div class="field"><label>Status 상태</label><input id="profStatus" disabled></div>
  </div>

  <div class="card">
    <h2>Change Password 비밀번호 변경</h2>
    <div class="field"><label>Current Password 현재 비밀번호</label><input id="curPw" type="password" maxlength="6" inputmode="numeric"></div>
    <div class="field"><label>New Password (6 digits) 새 비밀번호</label><input id="newPw" type="password" maxlength="6" inputmode="numeric"></div>
    <button onclick="changePassword()">Update 변경</button>
    <div id="pwMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Shipping Addresses 배송 주소 관리 <span style="font-weight:400;color:var(--text-2);font-size:11.5px;">— add one per store location / 매장이 여러 개면 각각 등록해두세요</span></h2>
    <div id="addrList"></div>
    <div class="field" style="margin-top:10px;"><label>Label (e.g. Main Store, Branch 2) 주소 이름</label><input id="newAddrLabel" placeholder="Main Store 예: 본점"></div>
    <div class="field"><label>Address 주소</label><textarea id="newAddrText" placeholder="123 Main St, Los Angeles, CA 90001"></textarea></div>
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-2);margin:2px 0 12px;min-height:40px;">
      <input type="checkbox" id="newAddrDefault"> Set as default 기본 주소로 설정
    </label>
    <button onclick="addAddress()">Add Address 주소 추가</button>
    <div id="addrMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Order History 주문 내역</h2>
    <div id="orderList"></div>
  </div>

  <div style="text-align:center;">
    <button class="secondary" onclick="logout()">Logout 로그아웃</button>
    </div>
</div>

<script>
const API_BASE = 'https://premium-k-backend.vercel.app/api';

// Site_Order 파일은 이 페이지와 다른 주소(도메인)에 있어서 localStorage를
// 공유하지 못합니다. 그래서 "내 계정" 링크를 누르면 Site_Order가 지금 로그인된
// 토큰을 URL에 함께 실어 보내주는데, 여기서 그 토큰을 받으면 이 페이지 쪽
// 저장공간에 있던 예전 값(다른 계정으로 로그인했을 수도 있는)을 덮어씁니다.
(function importTokenFromUrl(){
  const params = new URLSearchParams(location.search);
  const handoffToken = params.get('token');
  if (handoffToken) {
    localStorage.setItem('pk_token', handoffToken);
    localStorage.removeItem('pk_user'); // 새 토큰의 실제 주인은 loadProfile()이 서버에서 다시 확인합니다
    // 주소창에 토큰이 그대로 남아있지 않도록 URL을 깨끗하게 정리합니다.
    history.replaceState({}, '', location.pathname);
  }
})();

let token = localStorage.getItem('pk_token');
// 참고: pk_user는 더 이상 화면 표시용으로 신뢰하지 않습니다 — 같은 기기를 여러
// 계정이 함께 쓰면 이 캐시가 낡아있을 수 있기 때문입니다. 아래 loadProfile()이
// 매번 서버에서 실제 토큰 소유자 정보를 다시 조회해서 화면에 표시하고,
// 그 결과로 localStorage도 다시 최신화(자가 치유)합니다.
let authUser = JSON.parse(localStorage.getItem('pk_user') || 'null');

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers||{}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { ...options, headers });
  if (res.status === 204) return {};
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
  return data;
}

function toggleForgot(){
  const box = document.getElementById('forgotBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

async function requestReset(){
  const phone = document.getElementById('forgotPhone').value.trim();
  const msgEl = document.getElementById('forgotMsg');
  msgEl.className = 'msg';
  try {
    const data = await api('/auth/reset', { method:'POST', body: JSON.stringify({ action: 'request', phone }) });
    msgEl.className = 'msg ok';
    msgEl.textContent = data.message;
  } catch (e) {
    msgEl.className = 'msg err';
    msgEl.textContent = e.message;
  }
}

async function doLogin(){
  const phone = document.getElementById('lgPhone').value.trim();
  const password = document.getElementById('lgPassword').value.trim();
  const msgEl = document.getElementById('loginMsg');
  msgEl.className = 'msg';
  try {
    const data = await api('/auth/login', { method:'POST', body: JSON.stringify({ phone, password }) });
    token = data.token;
    // 로그인 즉시는 로그인 응답값으로 잠깐 채워두고, init()에서 바로
    // 서버 재조회(loadProfile)로 덮어써서 항상 정확한 값이 되게 합니다.
    authUser = { phone: phone.replace(/[^0-9]/g,''), approved: data.approved, email: data.email, companyName: data.companyName, isAdmin: data.isAdmin };
    localStorage.setItem('pk_token', token);
    localStorage.setItem('pk_user', JSON.stringify(authUser));
    init();
  } catch (e) {
    msgEl.className = 'msg err';
    msgEl.textContent = e.message;
  }
}

function goBackToShop(){
  if (history.length > 1) {
    history.back();
    } else {
    alert('상품 주문 화면(Site_Order 파일)을 직접 열어주세요.\nPlease open the Site_Order file directly to shop.');
  }
}

function logout(){
  localStorage.removeItem('pk_token');
  localStorage.removeItem('pk_user');
  // 이 기기에 남아있던 장바구니/주문자 정보도 같이 지워서, 다음에 이 기기로
  // 다른 계정이 로그인했을 때 이전 계정 정보가 섞여 보이지 않게 합니다.
  localStorage.removeItem('pk_cart');
  localStorage.removeItem('pk_custinfo');
  location.reload();
}

// ===== 3분간 조작이 없으면 자동 로그아웃 =====
const INACTIVITY_LIMIT_MS = 3 * 60 * 1000;
let inactivityTimer = null;
function resetInactivityTimer() {
  if (inactivityTimer) clearTimeout(inactivityTimer);
  if (!token) return;
  inactivityTimer = setTimeout(() => {
    if (!token) return;
    alert('3분간 조작이 없어 자동으로 로그아웃되었습니다.');
    logout();
  }, INACTIVITY_LIMIT_MS);
}
['mousemove', 'keydown', 'click', 'touchstart', 'scroll'].forEach(evt =>
  document.addEventListener(evt, resetInactivityTimer, { passive: true })
);

async function loadProfile(){
  // 화면에 보여줄 정보는 항상 서버에서 지금 이 토큰으로 새로 조회한 값을
  // 씁니다(로컬 캐시 authUser는 쓰지 않음). 이렇게 해야 같은 기기를 여러
  // 계정이 함께 써도 항상 실제 로그인된 계정의 정보만 표시됩니다.
  const data = await api('/account?resource=profile');
  document.getElementById('profPhone').value = data.phone || '';
  document.getElementById('profEmail').value = data.email || '—';
  document.getElementById('profCompany').value = data.companyName || '—';
  document.getElementById('profStatus').value = data.approved ? 'Approved 승인됨' : 'Pending approval 승인 대기중';
  document.getElementById('whoami').textContent = `${data.phone}님 ${data.isAdmin ? '(Admin 관리자)' : ''}`;

  // 서버에서 받은 최신 값으로 로컬 캐시도 갱신 (자가 치유)
  authUser = { phone: data.phone, approved: data.approved, email: data.email, companyName: data.companyName, isAdmin: data.isAdmin, tier: data.tier };
  localStorage.setItem('pk_user', JSON.stringify(authUser));
}

async function changePassword(){
  const currentPassword = document.getElementById('curPw').value.trim();
  const newPassword = document.getElementById('newPw').value.trim();
  const msgEl = document.getElementById('pwMsg');
  msgEl.className = 'msg';
  try {
    const data = await api('/account?resource=password', { method:'POST', body: JSON.stringify({ currentPassword, newPassword }) });
    msgEl.className = 'msg ok';
    msgEl.textContent = data.message;
    document.getElementById('curPw').value = '';
    document.getElementById('newPw').value = '';
  } catch (e) {
    msgEl.className = 'msg err';
    msgEl.textContent = e.message;
  }
}

async function loadAddresses(){
  const data = await api('/account?resource=addresses');
  const el = document.getElementById('addrList');
  if (!data.addresses.length) { el.innerHTML = '<div style="font-size:12.5px;color:var(--text-2);">No saved addresses yet. 등록된 주소가 없습니다.</div>'; return; }
  el.innerHTML = data.addresses.map(a => `
    <div class="addr-item">
    <div>
        <div style="font-weight:600;">${a.label || '주소 Address'}${a.is_default ? '<span class="pill">Default 기본</span>' : ''}</div>
        <div style="color:var(--text-2);font-size:12.5px;margin-top:2px;">${a.address}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">
        ${!a.is_default ? `<button class="secondary small" onclick="setDefaultAddress('${a.id}')">Set default 기본으로</button>` : ''}
        <button class="danger small" onclick="deleteAddress('${a.id}')">Delete 삭제</button>
      </div>
    </div>
  `).join('');
}

async function addAddress(){
  const label = document.getElementById('newAddrLabel').value.trim();
  const address = document.getElementById('newAddrText').value.trim();
  const isDefault = document.getElementById('newAddrDefault').checked;
  const msgEl = document.getElementById('addrMsg');
  msgEl.className = 'msg';
  try {
    await api('/account?resource=addresses', { method:'POST', body: JSON.stringify({ label, address, isDefault }) });
    document.getElementById('newAddrLabel').value = '';
    document.getElementById('newAddrText').value = '';
    document.getElementById('newAddrDefault').checked = false;
    msgEl.className = 'msg ok';
    msgEl.textContent = 'Address added. 주소가 추가되었습니다.';
    loadAddresses();
  } catch (e) {
    msgEl.className = 'msg err';
    msgEl.textContent = e.message;
  }
}

async function setDefaultAddress(id){
  await api('/account?resource=addresses', { method:'PATCH', body: JSON.stringify({ id, isDefault: true }) });
  loadAddresses();
}

async function deleteAddress(id){
  if (!confirm('Delete this address? 이 주소를 삭제할까요?')) return;
  await api('/account?resource=addresses', { method:'DELETE', body: JSON.stringify({ id }) });
  loadAddresses();
}

// v2.1 — 수령 방법 내부 값 대신 알아보기 쉬운 이름 (Site Order v8.4 픽업 추가)
const FULFILL_LABEL = { delivery: 'Delivery 딜리버리', shipping: 'Shipping 택배', pickup_warehouse: 'Warehouse pickup 창고 픽업', pickup_store: 'Store pickup 매장 픽업 (LA #1)' };
const escMeta = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function loadOrders(){
  const data = await api('/orders');
  const el = document.getElementById('orderList');
  if (!data.orders.length) { el.innerHTML = '<div style="font-size:12.5px;color:var(--text-2);">No orders yet. 아직 주문 내역이 없습니다.</div>'; return; }
  el.innerHTML = data.orders.map((o, idx) => `
    <div class="order-item">
      <div style="display:flex;justify-content:space-between;">
        <span style="font-weight:700;">$${Number(o.total).toFixed(2)}</span>
        <span class="meta">${new Date(o.created_at).toLocaleString('ko-KR')}</span>
      </div>
      <div class="meta">Invoice No. 인보이스 번호: ${o.invoice_number || '—'}</div>
      <div class="meta">Fulfillment 수령방법 ${escMeta(FULFILL_LABEL[o.delivery_method] || o.delivery_method || '—')} · Payment 결제방법 ${escMeta(o.payment_method || '—')}</div>
      <a class="linklike" onclick="toggleOrderDetail(${idx})">View details 상세보기</a>
      <pre id="orderDetail${idx}">${(o.order_text || '').replace(/</g,'&lt;')}</pre>
    </div>
  `).join('');
}

function toggleOrderDetail(idx){
  const el = document.getElementById('orderDetail' + idx);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

async function init(){
  if (!token) {
    document.getElementById('loginGate').style.display = 'block';
    document.getElementById('mainContent').style.display = 'none';
    return;
  }
  try {
    // 여기서 바로 서버에 물어봐서, 토큰이 실제로 유효한지 + 진짜 소유자가
    // 누구인지 확인합니다. 토큰이 만료/무효면 여기서 걸러지고 로그인 화면으로.
    await loadProfile();
  } catch (e) {
    // 토큰이 유효하지 않으면 로컬 캐시를 전부 지우고 로그인 화면으로 보냅니다.
    localStorage.removeItem('pk_token');
    localStorage.removeItem('pk_user');
    token = null; authUser = null;
    document.getElementById('loginGate').style.display = 'block';
    document.getElementById('mainContent').style.display = 'none';
    return;
  }
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  loadAddresses().catch(e => console.error(e));
  loadOrders().catch(e => console.error(e));
  resetInactivityTimer();
}

init();
</script>
</body>
</html>
